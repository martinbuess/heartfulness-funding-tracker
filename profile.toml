  "apply", "applications open", "applications are open", "application deadline", "now accepting",
  "accepting applications", "call for proposals", "call for applications", "call for concept notes",
  "request for proposals", "request for applications", "expression of interest", "nominations open",
  "open call",
]
call_title_words = ["grant", "grants", "fund", "funding", "award", "prize", "challenge", "call", "deadline", "rfp"]
skip_title_words = ["winner", "winners", "awarded", "recipients", "announces grantees", "recap"]
