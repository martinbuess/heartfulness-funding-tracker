# Forests by Heartfulness (FBH) funding profile.
#
# This is the one settings file you edit to change what the tracker looks for.
# Everything is plain lists of words. Words are matched at the start of a word and
# ignore capitals, so "afforest" catches afforestation and afforested.
#
# Every listing the tracker reads is kept in data/listings.csv. The ones that fit
# this profile go to data/matches.csv and the Google Sheet. Anything a rule below
# removes goes to data/filtered_out.csv with the reason, so you can check that
# nothing useful was cut.

name = "Forests by Heartfulness"

# --- 1. What FBH works on -----------------------------------------------------
# A listing is relevant if it mentions any word from these four areas. The area
# names appear in the "FBH area" column of the sheet. A word in the title counts
# more than a word only in the description.

[areas]
"Ecological restoration & biodiversity" = [
  "afforest", "reforest", "forest", "tree planting", "tree-planting", "trees", "native tree", "native species",
  "miyawaki", "ecological restoration", "ecosystem restoration", "land restoration", "landscape restoration",
  "forest landscape restoration", "degraded land", "degraded forest", "land degradation", "desertification",
  "biodiversity", "wildlife", "habitat", "ecosystem", "rewild", "mangrove", "grassland", "nature-based solution",
  "nature based solution", "nature-positive", "nature positive", "green cover", "urban forest", "seed bank",
  "endangered species", "threatened species", "species conservation", "protected area", "pollinat",
  "deforestation", "elephant", "tiger", "nature conservation", "conservation of nature", "restoration",
]
"Water & watershed" = [
  "lake", "pond", "wetland", "watershed", "check dam", "check-dam", "groundwater", "aquifer", "recharge",
  "rainwater harvest", "water harvesting", "water conservation", "water security", "water scarcity",
  "water resource", "water management", "freshwater", "river", "rejuvenat", "desilt", "catchment", "springshed",
  "spring revival", "riparian", "drought", "flood", "climate resilien", "climate adaptation",
  "ecosystem-based adaptation", "ecosystem based adaptation", "adaptation",
]
"Agroforestry & regenerative agriculture" = [
  "agroforest", "agro-forest", "regenerative agricultur", "regenerative farm", "agroecolog", "agro-ecolog",
  "sustainable agricultur", "climate-smart agricultur", "climate smart agricultur", "natural farming",
  "organic farming", "soil health", "soil fertility", "soil regenerat", "soil restoration", "smallholder",
  "farmer", "farming communit", "rural livelihood", "livelihood", "food security", "food system", "permaculture",
  "silvopast", "farm forestry", "horticultur", "farmer producer", "land use",
]
"Biochar & carbon removal" = [
  "biochar", "bio-char", "carbon removal", "carbon dioxide removal", "CDR", "carbon sequestration", "sequester",
  "carbon sink", "soil carbon", "carbon farming", "carbon credit", "carbon market", "negative emission",
  "pyrolysis", "crop residue", "stubble burning", "agricultural residue", "biomass", "enhanced weathering",
  "blue carbon",
]

[filter]
# Broad environmental words. A listing with only these (and no area word above)
# is still kept, labelled "General environment / climate", with a lower score.
general_keywords = [
  "climate", "environment", "ecolog", "natural resource", "sustainable development", "green growth",
  "nature", "conservation", "net zero", "net-zero", "SDG 13", "SDG 15", "SDG 6",
]

# Drop listings that mention any of these: other meanings of our words.
exclude_keywords = [
  "dental", "historic preservation", "historic restoration", "building restoration", "art restoration",
  "film restoration", "data recovery", "HIV", "cancer", "clinical trial", "vaccine", "opioid", "Watervliet",
  "Marine Corps", "Lake County", "Lake Charles", "Salt Lake", "Fort Lake", "Indiana",
]

# Funders to skip entirely by their Grants.gov code (HHS is health research).
exclude_funder_codes = ["HHS"]

# --- 2. Things FBH can't apply for (moved to data/filtered_out.csv) -----------

# Calls for individuals rather than organisations. Checked in the title only.
individual_title_words = [
  "scholarship", "fellowship", "phd", "ph.d", "doctoral", "postdoc", "master's", "masters", "internship",
  "student", "journalis", "photograph", "film", "essay", "poetry", "summer school", "online course",
  "training course", "webinar", "conference", "youth summit", "residency", "artist", "writers",
]

# Procurement and consultancy: buying services, not giving grants. Checked in the title.
procurement_title_words = [
  "tender", "RFQ", "request for quotation", "invitation to bid", "supply of", "procurement of",
  "consultant", "consultancy", "terms of reference", "TOR for", "hiring", "vacancy", "job",
]

# Funding only for companies or start-ups. Checked in the title. A listing that
# also says NGOs or nonprofits may apply is kept, marked "verify".
business_title_words = [
  "startup", "start-up", "SME", "small business", "SBIR", "STTR", "for-profit", "entrepreneur",
  "accelerator", "incubat", "venture", "investment readiness", "equity",
]

# Text that rules nonprofits out. Checked in the eligibility notes and description.
not_eligible_patterns = [
  'non-?profits? (organizations? )?(are|is) not eligible',
  'not open to (ngos|non-?profits|civil society)',
  'only (for-profit|private sector|companies|businesses|startups|smes) (are eligible|may apply|can apply)',
  'eligib\w* (applicants|entities) (are|is) limited to (states?|state agencies|local|units of local government|tribes|tribal|federally[- ]recognized|public|institutions of higher education|universities)',
  'only (states|state agencies|tribes|federally[- ]recognized tribes|units of local government|local governments|public agencies|institutions of higher education) (are eligible|may apply|can apply)',
]

# --- 3. Where the work can happen --------------------------------------------
[geography]
# India named: the best fit.
india = [
  "India", "Indian", "South Asia", "South Asian", "Telangana", "Andhra Pradesh", "Karnataka", "Tamil Nadu",
  "Kerala", "Maharashtra", "Gujarat", "Rajasthan", "Madhya Pradesh", "Uttar Pradesh", "Uttarakhand", "Bihar",
  "Odisha", "Orissa", "Jharkhand", "Chhattisgarh", "West Bengal", "Assam", "Meghalaya", "Himachal",
  "Punjab", "Haryana", "Delhi", "Goa", "Sikkim", "Hyderabad", "Bengaluru", "Bangalore", "Mumbai", "Chennai",
  "Western Ghats", "Himalaya",
]
# Open worldwide or to regions that include India: India is likely eligible, but check.
international = [
  "global", "globally", "worldwide", "international", "all countries", "any country", "developing countries",
  "developing nations", "low- and middle-income", "low and middle income", "LMIC", "LMICs", "Global South",
  "emerging economies", "emerging markets", "ODA-eligible", "ODA eligible", "DAC list", "Asia", "Asia-Pacific",
  "Asia Pacific", "Commonwealth", "foreign", "non-U.S.", "non-US", "outside the United States",
]
# Places that, when named in the title without India, mean the call is for somewhere else.
other_places = [
  "United States", "U.S.", "USA", "America", "Americas", "Canada", "Mexico", "Latin America", "Caribbean",
  "Brazil", "Colombia", "Peru", "Ecuador", "Bolivia", "Chile", "Argentina", "Guatemala", "Honduras",
  "Africa", "African", "Sub-Saharan", "Kenya", "Uganda", "Tanzania", "Rwanda", "Ethiopia", "Nigeria", "Ghana",
  "Malawi", "Zambia", "Zimbabwe", "Mozambique", "Madagascar", "South Africa", "Cameroon", "Senegal", "Mali",
  "Burkina Faso", "Niger", "Sierra Leone", "Liberia", "Somalia", "Sudan", "Egypt", "Morocco", "Tunisia",
  "Europe", "European", "EU Member States", "UK", "United Kingdom", "England", "Scotland", "Wales", "Ireland",
  "Germany", "France", "Italy", "Spain", "Portugal", "Netherlands", "Belgium", "Poland", "Ukraine", "Balkans",
  "Middle East", "MENA", "Jordan", "Lebanon", "Syria", "Iraq", "Yemen", "Turkey", "Afghanistan",
  "Pakistan", "Bangladesh", "Nepal", "Sri Lanka", "Bhutan", "Maldives", "Myanmar", "Thailand", "Vietnam",
  "Cambodia", "Laos", "Indonesia", "Philippines", "Malaysia", "Southeast Asia", "South-East Asia",
  "Central Asia", "East Asia", "China", "Mongolia", "Japan", "Korea", "Australia", "New Zealand",
  "Pacific Islands", "Fiji", "Papua New Guinea",
]
# Text that limits a call to the United States (or US-registered charities).
us_only_patterns = [
  'U\.?S\.?[- ]based (organizations|nonprofits|charities|applicants)',
  '(located|based|registered|operating) (in|within) the United States',
  'United States only',
  'U\.?S\.? (citizens|residents) only',
  'projects? (must be )?(located|conducted|implemented) (in|within) the (United States|U\.S\.)',
]

# --- 4. Who can apply ---------------------------------------------------------
[applicants]
# Words that say NGOs / nonprofits can apply.
nonprofit = [
  "NGO", "NGOs", "non-governmental", "nongovernmental", "nonprofit", "non-profit", "not-for-profit",
  "civil society", "CSO", "CSOs", "charit", "community-based organi", "community based organi", "CBO",
  "voluntary organi", "section 8 compan", "trusts and societies", "grassroots organi",
]
# Words that mean a partner or consortium may be needed. Shown as "check".
partnership = [
  "consortium", "consortia", "in partnership with", "partner with", "lead applicant", "co-applicant",
  "lead partner", "jointly with", "university partner", "joint application",
]
# Mentions of US charity status. Not a reason to drop: many US funders accept an
# equivalency determination or a US fiscal sponsor. Shown as "check".
us_charity_words = ["501(c)(3)", "501c3", "equivalency determination"]

# --- 5. Funding size (US dollars; other currencies are converted roughly) -------
[size]
priority_min_usd = 50000   # at or above this: a plus in the score
minimum_usd = 10000        # below this: moved to filtered_out.csv
# Rough exchange rates used only to compare sizes. Update now and then.
usd_per = { USD = 1.0, EUR = 1.10, GBP = 1.30, INR = 0.0114, CHF = 1.15, AUD = 0.65, CAD = 0.72, SEK = 0.095, NOK = 0.093, DKK = 0.148, JPY = 0.0067 }

