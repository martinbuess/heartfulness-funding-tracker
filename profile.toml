# data/calendar.csv in the repository only. See the README before setting this:
# the tab must be viewable by anyone with the link.
sheet_csv = ""

[leads]
# News feeds (RSS or WordPress) of funders and networks. Every run keeps posts that
# look like a call (apply, call for proposals, ...) and mention an FBH area word,
# and lists them in the sheet's Leads tab. Add a feed by copying the example block
# at the end and removing the # signs.
