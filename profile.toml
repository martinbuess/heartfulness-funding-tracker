# --- 7. FBH projects ------------------------------------------------------------
# The "Best-fit FBH projects" column lists the projects whose words appear in a call,
# best match first, with the words that matched. From the FBH summary deck (featured
# opportunities and capabilities) and the Gachibowli urban rainforest proposal,
# October 2026. Add a project by copying a block.
[[projects]]
name = "Shivgarh landscape restoration (MP)"
keywords = ["degraded forest", "forest restoration", "landscape restoration", "forest landscape", "reforest", "afforest",
            "protected forest", "hill greening", "land degradation", "degraded land", "desertification",
            "ecosystem restoration", "joint forest management", "community forest", "carbon sequestration",
            "forest management", "resilient forest", "ecosystem-based adaptation", "ecosystem based adaptation",
            "nature-based solution", "nature based solution"]

[[projects]]
name = "Peddaveedu pond & water security (Hyderabad)"
keywords = ["pond", "lake", "water body", "water bodies", "wetland", "flood", "water security", "water storage",
            "rainwater harvest", "water harvesting", "groundwater", "recharge", "check dam", "check-dam", "watershed",
            "desilt", "rejuvenat", "catchment", "climate resilien", "climate adaptation", "ecosystem-based adaptation",
            "ecosystem based adaptation"]

[[projects]]
