# --- 8. Sources -----------------------------------------------------------------
# Aggregators: RSS feeds of sites that publish grant calls. Each run reads each feed
# once (nothing else on the site) and keeps each call until its deadline passes, or
# keep_days when no deadline is given. Add one by copying a block.
[[aggregators]]
source = "fundsforngos"
name = "fundsforNGOs"
url = "https://www2.fundsforngos.org/feed/"
about = "Grant calls for NGOs worldwide (its newest 100 posts each day)"
pages = 4          # 25 posts per page; busy days have more than 25 new posts
keep_days = 120

[[aggregators]]
source = "terraviva"
name = "Terra Viva Grants"
url = "https://www.terravivagrants.org/feed/"
title_separator = " — "   # its titles are "Funder — Program"
about = "Funding News: open calls for agriculture, environment and natural resources in developing countries"
keep_days = 120
skip_title_words = ["Monthly Update"]   # summaries of past posts, not calls

# EU Funding & Tenders portal: open and upcoming EU calls, one search per word.
[eu_funding]
searches = ["restoration", "biodiversity", "agroforestry", "forest", "watershed", "soil", "biochar",
            "carbon removal", "nature-based", "climate adaptation", "regenerative"]
eur_to_usd = 1.10

# Watched pages: funders' apply pages with no feed. Each run compares the page's
# call-related sentences with the day before and flags any change, so you know
# when to look. Only pages whose site allows automated reading are listed:
# HCL Foundation and the Whitley Award ask robots to stay away, so they are in
# the calendar for manual checking instead.
