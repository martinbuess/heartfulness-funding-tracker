# --- 7. Sources -----------------------------------------------------------------
# fundsforNGOs: an aggregator of grant calls for NGOs worldwide. Read through its
# public WordPress feed (the same way Gaurav's tracker read its sister site).
[fundsforngos]
api = "https://www2.fundsforngos.org/wp-json/wp/v2/posts"
latest_pages = 2          # newest posts, 100 per page
# One extra page of posts for each of these searches, so older relevant calls are found.
searches = ["India", "biodiversity", "forest", "restoration", "water", "climate", "agriculture", "carbon"]
# A post with no deadline we can read stays listed this many days after first seen.
keep_days_without_deadline = 120

[calendar]
# The Calendar tab of the Google Sheet, read as CSV each run. Leave blank to use
# data/calendar.csv in the repository only. See the README before setting this:
# the tab must be viewable by anyone with the link.
